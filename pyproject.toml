[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twinaatma"
version = "0.4.0"
description = "Portable cognitive memory with a Self-model any AI agent can load (technical package: knowledgeos)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TwinAatma" }]
keywords = ["pkm", "memory", "mcp", "agent", "obsidian", "markdown"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
twinaatma = "knowledgeos.__main__:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["knowledgeos"]
include-package-data = false

[tool.setuptools.package-data]
knowledgeos = ["py.typed"]
